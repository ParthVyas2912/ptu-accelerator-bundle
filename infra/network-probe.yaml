name: ca-ptu-networkcheck
location: eastus2
type: Microsoft.App/containerApps
tags:
  workload: accelerator-eval
  owner: parth
  environment: mcaps-nonprod
  accelerator: shared-connectivity
  protected: "false"
properties:
  managedEnvironmentId: /subscriptions/1feb53b2-854a-4ea7-b5a6-709b7d804f70/resourceGroups/rg-ptu-bundle-platform/providers/Microsoft.App/managedEnvironments/cae-ptu-bundle
  workloadProfileName: Consumption
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: http
      allowInsecure: false
      ipSecurityRestrictions:
        - name: lab-client-only
          description: Temporary network probe restricted to the observed lab client
          ipAddressRange: 174.112.74.34/32
          action: Allow
  template:
    containers:
      - name: probe
        image: mcr.microsoft.com/azure-cli:latest
        command:
          - python3
        args:
          - -u
          - -c
          - |
            import json, socket, urllib.request, urllib.error, ipaddress
            from http.server import BaseHTTPRequestHandler, HTTPServer
            hosts = [
                "ptumacae7d804f70st.blob.core.windows.net",
                "ptu-macae-7d804f70-cosmos.documents.azure.com",
            ]
            class Handler(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path != "/":
                        self.send_error(404)
                        return
                    results = []
                    for host in hosts:
                        try:
                            addresses = sorted({entry[4][0] for entry in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
                            private = bool(addresses) and all(ipaddress.ip_address(address) in ipaddress.ip_network("10.246.2.0/24") for address in addresses)
                            result = {"host": host, "addresses": addresses, "in_private_endpoint_subnet": private}
                            try:
                                with urllib.request.urlopen("https://" + host, timeout=20) as response:
                                    result["anonymous_https_status"] = response.status
                            except urllib.error.HTTPError as error:
                                result["anonymous_https_status"] = error.code
                            except (urllib.error.URLError, TimeoutError) as error:
                                result["https_transport_error"] = str(error)
                            results.append(result)
                        except OSError as error:
                            results.append({"host": host, "dns_error": str(error)})
                    payload = json.dumps({"results": results, "model_calls": 0, "data_authorization_verified": False}).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(payload)))
                    self.end_headers()
                    self.wfile.write(payload)
            HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
        resources:
          cpu: 0.25
          memory: 0.5Gi
    scale:
      minReplicas: 0
      maxReplicas: 1
